name: Deploy React preview

# Publishes the React rebuild to https://easytelcrm.github.io/ops/next/ so it can be
# clicked through against real data without touching the live site at /ops/.
# Runs only from the rebuild branch — main still deploys the single-file app.

on:
  push:
    branches: [react-rebuild]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /ops/next/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: npm run build

      - name: Verify injection
        run: grep -rq "supabase.co" app/dist/assets && echo "Injection OK" || (echo "Injection FAILED" && exit 1)

      - name: Deploy preview to gh-pages:/next
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          publish_branch: gh-pages
          # Only the next/ subtree is replaced; the live site at the branch root is untouched.
          destination_dir: next
